version: '3.9'
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dto-vs-domain-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Your_password123", "-Q", "SELECT 1", "-No", "-l", "2"]
      interval: 10s
      timeout: 2s
      retries: 10
    volumes:
      - sql-data:/var/opt/mssql
  api:
    build:
      context: ./src/DotNet.DtoVsDomain.Api
      dockerfile: Dockerfile
    image: dto-vs-domain-api
    container_name: dto-vs-domain-api
    depends_on:
      sql:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Sql=Server=sql;Database=DtoVsDomain;User Id=sa;Password=Your_password123;TrustServerCertificate=True;
    ports:
      - "8080:8080"
volumes:
  sql-data:
